name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (fmt + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: slsdk-rs fmt
        run: cargo fmt --check --manifest-path slsdk-rs/Cargo.toml
      - name: slsdk-rs test
        run: cargo test --manifest-path slsdk-rs/Cargo.toml
      - name: shell fmt
        run: cargo fmt --check --manifest-path shell/src-tauri/Cargo.toml
      - name: shell test
        run: cargo test --manifest-path shell/src-tauri/Cargo.toml

  web:
    name: web (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            slsdk-ts/pnpm-lock.yaml
            shell/pnpm-lock.yaml
      - name: slsdk-ts typecheck + test
        run: |
          cd slsdk-ts
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
      - name: shell build
        run: |
          cd shell
          pnpm install --frozen-lockfile
          pnpm run build
