name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
            attach: shell/src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            bundles: app,dmg
            attach: |
              shell/src-tauri/target/release/bundle/dmg/*.dmg
              shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
          - os: windows-latest
            bundles: msi
            attach: shell/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shell/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.0

      - name: Install tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: |
          # the shell build compiles the slsdk-ts sources directly (the
          # dev-mode alias), so slsdk-ts's own deps (react/rxjs) must be
          # installed before tsc resolves those imports
          cd slsdk-ts && pnpm install --frozen-lockfile
          cd ../shell && pnpm install --frozen-lockfile

      - name: Import Apple Developer certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare notarization API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd shell
          cargo tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: EF1C3FA7951CFF012D587A683AD7DDE9227D264A
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build (other platforms)
        if: runner.os != 'macOS'
        run: |
          cd shell
          cargo tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Smoke gate before anything is uploaded or attached: the frontend must
      # boot in a real browser (mount + no module-chain errors). A broken
      # release build must not reach the release page.
      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          cd shell
          pnpm run smoke

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superlive-${{ runner.os }}
          path: |
            ${{ matrix.attach }}
            shell/src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.attach }}

  # The updater endpoint points at latest.json on the release; tauri only
  # produces the bundles and .sig files, so the manifest is assembled here
  # from the three platform builds. The update carriers are deb (Linux),
  # .app.tar.gz (macOS — the dmg is never signed and ships only as the
  # manual-install download), and msi (Windows).
  updater-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB=$(ls artifacts/superlive-Linux/deb/*.deb)
          APP_TARBALL=$(ls artifacts/superlive-macOS/macos/*.app.tar.gz)
          MSI=$(ls artifacts/superlive-Windows/msi/*.msi)
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deb_url "$BASE_URL/$(basename "$DEB")" \
            --arg deb_sig "$(tr -d '\n' < "$DEB.sig")" \
            --arg app_url "$BASE_URL/$(basename "$APP_TARBALL")" \
            --arg app_sig "$(tr -d '\n' < "$APP_TARBALL.sig")" \
            --arg msi_url "$BASE_URL/$(basename "$MSI")" \
            --arg msi_sig "$(tr -d '\n' < "$MSI.sig")" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": { signature: $deb_sig, url: $deb_url },
                "darwin-aarch64": { signature: $app_sig, url: $app_url },
                "windows-x86_64": { signature: $msi_sig, url: $msi_url }
              }
            }' > latest.json
          cat latest.json

      - name: Attach updater manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
