[package]
name = "superlive-shell"
version = "0.5.1"
default-run = "superlive-shell"
edition = "2024"
rust-version = "1.85"
description = "superlive v2 componentized platform shell: registry + unified API gateway + component lifecycle management"

[lib]
name = "superlive_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset enables the `asset://` custom protocol (component webviews
# read local media through it); the config block alone is a no-op without it
# (tauri gates both scope init and scheme registration behind this feature).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "process", "net", "io-util", "time", "macros", "sync", "fs"] }
axum = { version = "0.8", features = ["ws"] }
# Only the TokioIo adapter is used (the gateway/lifecycle hyper conn ↔ tokio IO bridge)
hyper-util = { version = "0.1", features = ["tokio"] }
# gateway: hyper conn handshake (forwarding / ws pump) and the TokioIo adapter
# (client conn used hop-by-hop: after hyper-util's trimming it no longer
# propagates the enabling, so an explicit declaration is needed)
hyper = { version = "1", features = ["client", "http1", "server"] }
# Health probe response body collection (BodyExt)
http-body-util = "0.1"
# Token constant-time comparison (same scheme as slsdk-rs, guarding against
# timing side channels)
subtle = "2"
# per-component / shell-level token generation
rand = "0.9"
# Install package extraction: the package format is defined by this repo, so
# only deflate is enabled to cut the default full compression-format dependencies
zip = { version = "2", default-features = false, features = ["deflate"] }
# Plane B contract SDK: the shell references it as the adjudicator
# (manifest validation / registration protocol), same-repo path
slsdk-rs = { path = "../../slsdk-rs" }
# Built-in creation flow: standard three-shape project scaffolding,
# same-repo path
slscaffold = { path = "../../slscaffold" }
# Parent-death process guards (kill_on_drop / Linux PDEATHSIG / Windows
# KILL_ON_JOB_CLOSE job): the single implementation shared by the shell and
# the process-death tests — a workspace member, so both crates share one
# Cargo.lock and one target directory.
superlive-process-guard = { path = "process-guard" }
# Dev manifest files fingerprinting (create flow); also covers the tests
sha2 = "0.10"
# Configuration-plane shell-side required-field comparison: reads the
# component's config.toml as a table (upgrade drift detection, rule 3).
# Version aligned with slsdk-rs's toml so Cargo converges to one instance and
# both ends parse identically
toml = "0.8"
# Component update flow (check_update / download_update): feed + package zip
# fetch. Defaults on, matching x-agent: default-tls is rustls upstream (no
# native-tls system dependency), system proxy support included.
reqwest = { version = "0.13" }
# Update feed semver comparison (strict greater = an update is available)
semver = "1"
tauri-plugin-log = "2.9.2"

# unix graceful exit sends SIGTERM (tokio only has SIGKILL-grade start_kill;
# nix is the safe wrapper, no unsafe)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
# installer: stale-process kill (libc::kill) and EACCES classification. The
# PDEATHSIG fork-exec backstop now lives in the process-guard crate, which
# declares its own libc.
libc = "0.2"

# Windows orphan sweeper (installer): toolhelp32 process snapshot + image-path
# matching + termination, clearing stale component processes that hold a
# sharing violation on the install directory. (The lifecycle job-object guard
# itself moved into the process-guard crate, which declares its own
# windows-sys.)
# Already in the tree via tauri/wry — declared here for direct use.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
# Temp directories for the installer/lifecycle tests
tempfile = "3"
# Test-side router.oneshot (auth/gateway/server tests)
tower = "0.5"
# subscriptions tests: the mock component's /events endpoint streams a
# broadcast feed as chunked NDJSON, which needs a futures_core::Stream impl
# (already in the dependency tree via axum/slsdk-rs — no new code compiled in)
futures-core = "0.3"
# Asset-scope tests: tauri's `test` feature is an empty marker that exposes
# `tauri::test::mock_app` (headless MockRuntime app, same pattern tauri's own
# protocol/asset.rs tests use). Unified with [dependencies] tauri in test
# builds only; production builds keep the [dependencies] feature set.
tauri = { version = "2", features = ["test"] }

# Workspace root: the process-guard crate lives below this manifest, so both
# crates share one Cargo.lock and one target directory.
[workspace]
members = ["process-guard"]
